<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Saat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saat">
<meta name="theme-color" content="#000000">
<meta name="description" content="Gece masa saati: tam ekran, yatay, çevrimdışı çalışır.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root">
<div id="stage">

<div id="faces">
<div id="track">

<section class="face center" data-face="Yuvarlak">
  <div id="yv"></div>
  <div class="date" style="position:absolute; left:50%; bottom:3.5cqh; transform:translateX(-50%); gap:.35em; font-family:Outfit, sans-serif; font-weight:500; font-size:6.5cqh"><span class="dn" style="color:#fff"></span><span class="dw" style="color:#4da3f0"></span></div>
</section>

<section class="face" data-face="Analog">
  <div id="an-ticks"></div>
  <div class="num" style="left:50%; top:21%; font-family:Unbounded, sans-serif; font-weight:600; font-size:13cqh; color:#fff">12</div>
  <div class="num" style="left:81%; top:50%; font-family:Unbounded, sans-serif; font-weight:600; font-size:13cqh; color:#fff">3</div>
  <div class="num" style="left:50%; top:79%; font-family:Unbounded, sans-serif; font-weight:600; font-size:13cqh; color:#fff">6</div>
  <div class="num" style="left:19%; top:50%; font-family:Unbounded, sans-serif; font-weight:600; font-size:13cqh; color:#fff">9</div>
  <div class="date" style="position:absolute; left:69.5%; top:50%; transform:translate(-50%,-50%); gap:.3em; font-family:Outfit, sans-serif; font-weight:500; font-size:6.5cqh"><span class="dn" style="color:#fff"></span><span class="dw" style="color:#e5484d"></span></div>
  <div class="hand hour"><i class="stem" style="background:#fff"></i><i class="blade" style="height:19cqh; background:#fff"></i></div>
  <div class="hand min"><i class="stem" style="background:#fff"></i><i class="blade" style="height:34cqh; background:#fff"></i></div>
  <div class="sec" hidden><i style="background:#ff9f0a"></i></div>
  <div class="cap" style="background:radial-gradient(circle, #000 0 0.5cqh, #ff9f0a 0.6cqh 1.3cqh, #fff 1.4cqh)"></div>
</section>

<section class="face" data-face="Dünya">
  <div id="map" style="position:absolute; inset:5cqh 3cqw 5cqh 3cqw; display:flex; align-items:center; justify-content:center"></div>
  <div id="map-pending" hidden style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-family:Outfit, sans-serif; font-size:3.5cqh; color:#5a5a60">Harita yükleniyor…</div>
  <div style="position:absolute; left:5cqw; bottom:8cqh; text-shadow:0 0 10px #000, 0 0 24px #000">
    <div style="font-family:Outfit, sans-serif; font-weight:500; font-size:7cqh; line-height:1; color:#ff9f0a; margin-bottom:1.5cqh">İstanbul</div>
    <div class="t-hm" style="font-family:Outfit, sans-serif; font-weight:500; font-size:22cqh; line-height:.9; letter-spacing:-0.02em; color:#fff"></div>
  </div>
  <div class="date" style="position:absolute; left:5cqw; top:8cqh; gap:.35em; font-family:Outfit, sans-serif; font-weight:500; font-size:6cqh; text-shadow:0 0 10px #000"><span class="dn" style="color:#fff"></span><span class="dw" style="color:#ff9f0a"></span></div>
</section>

<section class="face center" data-face="Parlayan" style="background:radial-gradient(120% 150% at 18% 8%, #4a2a66 0%, #2b1844 42%, #110a1e 100%)">
  <div class="t-hm" style="font-family:Outfit, sans-serif; font-weight:500; font-size:58cqh; line-height:1; letter-spacing:-0.03em; color:#ecc0ff; text-shadow:0 0 2.5cqh rgba(236,192,255,.55), 0 0 10cqh rgba(168,96,230,.4)"></div>
  <div class="date" style="position:absolute; left:50%; bottom:8cqh; transform:translateX(-50%); gap:.35em; font-family:Outfit, sans-serif; font-weight:500; font-size:6cqh"><span class="dn" style="color:#fff"></span><span class="dw" style="color:#ecc0ff"></span></div>
</section>

<section class="face center" data-face="Modernist">
  <div id="modern" style="display:flex; font-family:Anton, sans-serif; font-size:50cqw; line-height:1; letter-spacing:-0.02em; white-space:nowrap; transform-origin:center">
    <span class="t-hh" style="color:#fff"></span><span class="t-mm" style="color:#5d5d62; margin-left:0.06em"></span>
  </div>
  <div class="date" style="position:absolute; right:3cqw; bottom:4cqh; gap:.35em; font-family:Outfit, sans-serif; font-weight:500; font-size:6cqh; mix-blend-mode:difference"><span class="dn" style="color:#fff"></span><span class="dw" style="color:#fff"></span></div>
</section>

<section class="face" data-face="Klasik" style="background:radial-gradient(120% 120% at 50% 45%, #141210, #000 75%)">
  <div style="position:absolute; inset:2cqh; border:0.6cqh solid #b8932f; border-radius:3.5cqh; box-shadow:inset 0 0 0 0.25cqh #000, inset 0 0 0 0.45cqh #6b5a2a"></div>
  <div id="kl-ticks"></div>
  <div class="num" style="left:50%; top:21%; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:15cqh; color:#d9b85c">XII</div>
  <div class="num" style="left:81%; top:50%; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:15cqh; color:#d9b85c">III</div>
  <div class="num" style="left:50%; top:79%; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:15cqh; color:#d9b85c">VI</div>
  <div class="num" style="left:19%; top:50%; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:15cqh; color:#d9b85c">IX</div>
  <div class="date" style="position:absolute; left:69.5%; top:50%; transform:translate(-50%,-50%); gap:.3em; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:7.5cqh"><span class="dn" style="color:#f4e19c"></span><span class="dw" style="color:#b8932f"></span></div>
  <div class="hand hour"><i class="stem" style="background:#c9a94f"></i><i class="blade" style="height:19cqh; background:linear-gradient(90deg, #9d7c1e, #f4e19c 50%, #9d7c1e)"></i></div>
  <div class="hand min"><i class="stem" style="background:#c9a94f"></i><i class="blade" style="height:34cqh; background:linear-gradient(90deg, #9d7c1e, #f4e19c 50%, #9d7c1e)"></i></div>
  <div class="sec" hidden><i style="background:#e2c46d"></i></div>
  <div class="cap" style="background:radial-gradient(circle, #000 0 0.5cqh, #f4e19c 0.6cqh 1.3cqh, #9d7c1e 1.4cqh)"></div>
</section>

<section class="face center" data-face="Minimal">
  <div style="position:relative; width:100%; display:flex; flex-direction:column; align-items:center">
    <div class="t-hm" style="font-family:Outfit, sans-serif; font-weight:200; font-size:56cqh; line-height:1; letter-spacing:.04em; color:#fff"></div>
    <div style="position:relative; width:100%; height:1px; background:#2c2c2e; margin-top:7cqh">
      <div id="min-fill" style="position:absolute; left:0; top:0; height:1px; background:#fff; transition:width .6s ease"></div>
    </div>
    <div class="date" style="position:absolute; right:5cqw; bottom:3.5cqh; gap:.35em; font-family:Outfit, sans-serif; font-weight:400; font-size:5cqh; letter-spacing:.06em"><span class="dn" style="color:#fff"></span><span class="dw" style="color:#8e8e93"></span></div>
  </div>
</section>

<section class="face" data-face="Yıldız">
  <div id="bg-stars"></div>
  <div id="stars" style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%)"></div>
  <div class="date" style="position:absolute; left:50%; bottom:6cqh; transform:translateX(-50%); gap:.35em; font-family:Outfit, sans-serif; font-weight:400; font-size:5cqh; letter-spacing:.08em"><span class="dn" style="color:#a09b8e"></span><span class="dw" style="color:#6a675f"></span></div>
</section>

<section class="face center" data-face="Ay" style="gap:8cqw">
  <svg viewBox="-50 -50 100 100" style="width:60cqh; height:60cqh; flex:none" aria-hidden="true">
    <circle r="48" fill="#bdb7a6"></circle>
    <circle cx="-14" cy="-18" r="9" fill="rgba(0,0,0,.09)"></circle>
    <circle cx="16" cy="6" r="13" fill="rgba(0,0,0,.07)"></circle>
    <circle cx="-8" cy="22" r="6" fill="rgba(0,0,0,.1)"></circle>
    <circle cx="26" cy="-24" r="4" fill="rgba(0,0,0,.1)"></circle>
    <path id="moon-shadow" fill="#070708"></path>
    <circle r="48" fill="none" stroke="#2a2a2e" stroke-width="0.8"></circle>
  </svg>
  <div style="display:flex; flex-direction:column; gap:2.5cqh">
    <div class="t-hm" style="font-family:Outfit, sans-serif; font-weight:300; font-size:30cqh; line-height:1; letter-spacing:-.01em; color:#bdb7a6"></div>
    <div id="moon-name" style="font-family:Outfit, sans-serif; font-weight:400; font-size:6cqh; line-height:1; color:#7d786c"></div>
    <div class="date" style="gap:.35em; font-family:Outfit, sans-serif; font-weight:400; font-size:6cqh"><span class="dn" style="color:#bdb7a6"></span><span class="dw" style="color:#7d786c"></span></div>
  </div>
</section>

<section class="face" data-face="Sözcük" style="display:flex; align-items:center; padding-left:9cqw; box-sizing:border-box">
  <div id="words" style="display:flex; flex-direction:column; font-family:'Cormorant Garamond', serif; font-weight:500; font-size:19cqh; line-height:1.02; letter-spacing:-.01em"></div>
  <div class="date" style="position:absolute; right:6cqw; bottom:6cqh; gap:.3em; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:7cqh"><span class="dn" style="color:#c4bfb2"></span><span class="dw" style="color:#6a675f"></span></div>
</section>

<!-- v2 yüzleri: UPDATE.md'deki tarife göre (referans HTML güncel değildi) -->

<section class="face center" data-face="Kontur">
  <div class="fit" data-fit=".84" style="position:relative; font-family:Fredoka, sans-serif; font-weight:700; font-size:56cqh; line-height:1; white-space:nowrap">
    <div class="t-hm kt" style="-webkit-text-stroke:15px #123c4a"></div>
    <div class="t-hm kt" style="-webkit-text-stroke:12px #000"></div>
    <div class="t-hm kt" style="-webkit-text-stroke:9px #1f7a74"></div>
    <div class="t-hm kt" style="-webkit-text-stroke:6px #000"></div>
    <div class="t-hm kt" style="-webkit-text-stroke:3px #48c19f"></div>
    <div class="t-hm kt" style="color:#000; -webkit-text-stroke:.7px #d6ffe6"></div>
  </div>
  <div class="date" style="position:absolute; right:5cqw; bottom:6cqh; gap:.35em; font-family:Outfit, sans-serif; font-weight:400; font-size:5cqh"><span class="dn" style="color:#d6ffe6"></span><span class="dw" style="color:#48c19f"></span></div>
</section>

<section class="face center" data-face="Dilim">
  <div style="position:absolute; left:8cqw; right:8cqw; top:50%; height:1px; background:#2a2a40"></div>
  <div class="fit" data-fit=".86" style="position:relative; font-family:Unbounded, sans-serif; font-weight:600; font-size:48cqh; line-height:1; letter-spacing:-.02em; white-space:nowrap">
    <div class="t-hm dl" style="clip-path:inset(0 0 67% 0); transform:translateX(-3.5cqw); color:#ff5a4e"></div>
    <div class="t-hm dl dl-dots" style="clip-path:inset(32% 0 34% 0); transform:translateX(2cqw)"></div>
    <div class="t-hm dl" style="clip-path:inset(65% 0 0 0); transform:translateX(-1cqw); color:transparent; -webkit-text-stroke:.45cqh #5b8cff"></div>
  </div>
  <div class="date" style="position:absolute; left:5cqw; bottom:6cqh; gap:.35em; font-family:Outfit, sans-serif; font-weight:500; font-size:5cqh"><span class="dn" style="color:#ff5a4e"></span><span class="dw" style="color:#5b8cff"></span></div>
</section>

<section class="face center" data-face="Yörünge" style="background:radial-gradient(55% 85% at 34% 50%, #1a0d05, #000 62%); gap:6cqw">
  <div id="orr-stars" class="bgdots"></div>
  <svg viewBox="-50 -50 100 100" style="position:relative; width:min(90cqh, 52cqw); height:min(90cqh, 52cqw); flex:none" aria-hidden="true">
    <defs>
      <radialGradient id="g-sun"><stop offset="0" stop-color="#fff7dc"/><stop offset=".55" stop-color="#ffcf73"/><stop offset="1" stop-color="#ff7a3d"/></radialGradient>
      <radialGradient id="g-sunhalo"><stop offset="0" stop-color="#ff9a4a" stop-opacity=".5"/><stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/></radialGradient>
      <radialGradient id="g-teal" cx=".35" cy=".35"><stop offset="0" stop-color="#b5fff4"/><stop offset=".55" stop-color="#4fd1c5"/><stop offset="1" stop-color="#1b6f69"/></radialGradient>
      <radialGradient id="g-violet" cx=".35" cy=".35"><stop offset="0" stop-color="#e3dcff"/><stop offset=".55" stop-color="#9b8cff"/><stop offset="1" stop-color="#4a3c9e"/></radialGradient>
    </defs>
    <circle r="46" fill="none" stroke="#24212c" stroke-width=".6" stroke-dasharray=".05 1.9" stroke-linecap="round"/>
    <circle r="40" fill="none" stroke="#24212c" stroke-width=".4"/>
    <circle r="26" fill="none" stroke="#24212c" stroke-width=".4"/>
    <g id="orr-ticks"></g>
    <circle id="orr-trail-h" r="40" fill="none" stroke="#4fd1c5" stroke-opacity=".5" stroke-width=".8" stroke-linecap="round" pathLength="100" transform="rotate(-90)"/>
    <circle id="orr-trail-m" r="26" fill="none" stroke="#9b8cff" stroke-opacity=".5" stroke-width=".8" stroke-linecap="round" pathLength="100" transform="rotate(-90)"/>
    <circle r="17" fill="url(#g-sunhalo)"/>
    <circle r="6.5" fill="url(#g-sun)"/>
    <g id="orr-h"><circle r="4.2" fill="url(#g-teal)"/><ellipse rx="7.8" ry="2.1" fill="none" stroke="#f0d8a4" stroke-width=".55" transform="rotate(-22)"/></g>
    <g id="orr-m"><circle r="3" fill="url(#g-violet)"/><circle id="orr-moon" r=".9" fill="#d8d4e6"/></g>
  </svg>
  <div style="position:relative; display:flex; flex-direction:column; gap:2.5cqh">
    <div style="font-family:Outfit, sans-serif; font-weight:300; font-size:min(24cqh, 11cqw); line-height:1; white-space:nowrap"><span class="t-hh" style="color:#7fe3d6"></span><span style="color:#4a4558">:</span><span class="t-mm" style="color:#b3a8ff"></span></div>
    <div class="date" style="gap:.35em; font-family:Outfit, sans-serif; font-weight:400; font-size:5cqh"><span class="dn" style="color:#ffcf73"></span><span class="dw" style="color:#8a83a6"></span></div>
  </div>
</section>

<section class="face" data-face="Çetele" style="display:flex; flex-direction:column; justify-content:center; gap:4.5cqh; padding:0 8cqw; box-sizing:border-box">
  <div class="ct-row" style="color:#ffc400"><span id="ct-doy"></span><i class="ct-hazard"></i></div>
  <div class="t-hm" style="font-family:'Saira Stencil One', sans-serif; font-size:min(42cqh, 19cqw); line-height:.86; color:#f2efe6"></div>
  <svg id="ct-tally" viewBox="0 0 268 40" style="width:100cqh; height:14.9cqh; overflow:visible" aria-hidden="true"></svg>
  <div class="ct-row" style="color:#7c7a74"><span id="ct-left"></span><span class="date" style="margin-left:auto; gap:.5em"><span class="dn" style="color:#f2efe6"></span><span class="dw" style="color:#ffc400"></span></span></div>
</section>

<section class="face center" data-face="Odak" style="gap:8cqw">
  <div style="display:flex; flex-direction:column; gap:3.5cqh">
    <div class="t-hm" style="font-family:Outfit, sans-serif; font-weight:500; font-size:min(30cqh, 14cqw); line-height:1; color:#fff"></div>
    <div style="display:flex; align-items:center; gap:2cqh; font-family:Outfit, sans-serif; font-weight:500; font-size:3.2cqh; letter-spacing:.18em; line-height:1; color:#8e8e93"><span id="fc-boxes" style="display:flex; gap:1.2cqh"></span><span id="fc-count"></span></div>
    <div class="date" style="gap:.35em; font-family:Outfit, sans-serif; font-weight:500; font-size:4.5cqh"><span class="dn" style="color:#fff"></span><span class="dw" style="color:#ff5a1f"></span></div>
  </div>
  <div style="position:relative; width:min(66cqh, 40cqw); height:min(66cqh, 40cqw); flex:none">
    <svg viewBox="0 0 40 40" style="width:100%; height:100%; transform:rotate(-90deg)" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#1c1c1e" stroke-width="1.6"/><circle id="fc-ring" cx="20" cy="20" r="18" fill="none" stroke="#ff5a1f" stroke-width="1.6" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/></svg>
    <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5cqh">
      <div id="fc-num" style="font-family:Outfit, sans-serif; font-weight:200; font-size:min(24cqh, 14cqw); line-height:1"></div>
      <div id="fc-label" style="font-family:Outfit, sans-serif; font-weight:500; font-size:2.6cqh; letter-spacing:.18em; line-height:1.2; color:#8e8e93; text-align:center; max-width:80%"></div>
    </div>
  </div>
</section>

<section class="face" data-face="Gün Yayı">
  <div class="t-hm" style="position:absolute; left:6cqw; top:7cqh; font-family:Outfit, sans-serif; font-weight:300; font-size:20cqh; line-height:1; color:#fff"></div>
  <div class="date" style="position:absolute; right:6cqw; top:8cqh; gap:.35em; font-family:Outfit, sans-serif; font-weight:500; font-size:5cqh"><span class="dn" style="color:#fff"></span><span class="dw" style="color:#ffd27a"></span></div>
  <div style="position:absolute; left:50%; bottom:5cqh; translate:-50% 0; width:min(92cqw, 144cqh); aspect-ratio:2/1">
    <svg viewBox="0 0 200 100" style="width:100%; height:100%; display:block; overflow:visible" aria-hidden="true">
      <defs>
        <linearGradient id="g-trail" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="180" y2="0"><stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
        <radialGradient id="g-sunglow"><stop offset="0" stop-color="#ffb347" stop-opacity=".6"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
      </defs>
      <line x1="6" y1="70" x2="194" y2="70" stroke="#2c2c2e" stroke-width=".6"/>
      <path d="M 20 70 A 80 52 0 0 1 180 70" fill="none" stroke="#3a3a3c" stroke-width="1" stroke-dasharray=".05 3" stroke-linecap="round"/>
      <path d="M 20 70 A 80 18 0 0 0 180 70" fill="none" stroke="#242426" stroke-width="1" stroke-dasharray=".05 3" stroke-linecap="round"/>
      <path id="sa-trail" fill="none" stroke="url(#g-trail)" stroke-width="1.6" stroke-linecap="round"/>
      <circle id="sa-glow" r="11" fill="url(#g-sunglow)"/>
      <circle id="sa-sun" r="3.6" fill="#ffd27a"/>
    </svg>
    <div class="sa-lab" style="left:10%"><div class="sa-k" id="sa-rise-k"></div><div class="sa-v" id="sa-rise"></div></div>
    <div class="sa-lab" style="left:90%"><div class="sa-k" id="sa-set-k"></div><div class="sa-v" id="sa-set"></div></div>
  </div>
</section>

<section class="face" data-face="Nixie" style="background:radial-gradient(70% 60% at 50% 55%, #160b04, #000 70%); display:flex; flex-direction:column; align-items:center; justify-content:center">
  <div style="display:flex; align-items:flex-end; gap:1.6cqh">
    <div class="nx-tube"><span class="nx-ghost">8</span><span class="nx-d"></span></div>
    <div class="nx-tube"><span class="nx-ghost">8</span><span class="nx-d"></span></div>
    <div class="nx-colon"><i></i><i></i></div>
    <div class="nx-tube"><span class="nx-ghost">8</span><span class="nx-d"></span></div>
    <div class="nx-tube"><span class="nx-ghost">8</span><span class="nx-d"></span></div>
  </div>
  <div class="nx-plinth"></div>
  <div class="date" style="position:absolute; left:50%; bottom:4cqh; translate:-50% 0; gap:.35em; font-family:Outfit, sans-serif; font-weight:500; font-size:4.5cqh"><span class="dn" style="color:#ffc08a"></span><span class="dw" style="color:#a0602e"></span></div>
</section>

<section class="face center" data-face="Kum Saati" style="gap:7cqw">
  <svg viewBox="0 0 100 140" style="height:86cqh; width:61.4cqh; flex:none" aria-hidden="true">
    <defs>
      <clipPath id="hg-clip"><path d="M 20 10 H 80 C 80 40 56 58 52 70 C 56 82 80 100 80 130 H 20 C 20 100 44 82 48 70 C 44 58 20 40 20 10 Z"/></clipPath>
      <linearGradient id="g-sand" x1="0" x2="1"><stop offset="0" stop-color="#c98d4a"/><stop offset=".5" stop-color="#f0c486"/><stop offset="1" stop-color="#c98d4a"/></linearGradient>
      <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5531"/><stop offset="1" stop-color="#3e2914"/></linearGradient>
    </defs>
    <rect x="13" y="9" width="3" height="122" fill="#8a6a45"/>
    <rect x="84" y="9" width="3" height="122" fill="#8a6a45"/>
    <path d="M 20 10 H 80 C 80 40 56 58 52 70 C 56 82 80 100 80 130 H 20 C 20 100 44 82 48 70 C 44 58 20 40 20 10 Z" fill="rgba(240,217,181,.04)"/>
    <g clip-path="url(#hg-clip)">
      <path id="hg-top" fill="url(#g-sand)"/>
      <path id="hg-bot" fill="url(#g-sand)"/>
      <line id="hg-stream" x1="50" x2="50" y1="70" stroke="#e8b878" stroke-width=".8"/>
    </g>
    <path d="M 20 10 H 80 C 80 40 56 58 52 70 C 56 82 80 100 80 130 H 20 C 20 100 44 82 48 70 C 44 58 20 40 20 10 Z" fill="none" stroke="rgba(240,217,181,.35)" stroke-width=".8"/>
    <rect x="9" y="2" width="82" height="8" rx="2" fill="url(#g-wood)"/>
    <rect x="9" y="130" width="82" height="8" rx="2" fill="url(#g-wood)"/>
  </svg>
  <div style="display:flex; flex-direction:column; gap:2.5cqh">
    <div class="t-hm" style="font-family:Outfit, sans-serif; font-weight:300; font-size:min(26cqh, 12cqw); line-height:1; color:#f0d9b5"></div>
    <div class="date" style="gap:.35em; font-family:Outfit, sans-serif; font-weight:400; font-size:5cqh"><span class="dn" style="color:#f0d9b5"></span><span class="dw" style="color:#a07a4c"></span></div>
  </div>
</section>

<section class="face center" data-face="İkili">
  <div id="bin" style="display:flex; align-items:flex-start; gap:4cqh"></div>
  <div class="date" style="position:absolute; right:5cqw; bottom:6cqh; gap:.35em; font-family:Outfit, sans-serif; font-weight:500; font-size:5cqh"><span class="dn" style="color:#5ac8fa"></span><span class="dw" style="color:#ff9f0a"></span></div>
</section>

<section class="face" data-face="Daktilo" style="background:#0b0a09; display:flex; flex-direction:column; justify-content:center; gap:4cqh; padding-left:10cqw; box-sizing:border-box">
  <div id="dk" style="font-family:'Special Elite', monospace; font-size:min(40cqh, 17cqw); line-height:1; white-space:nowrap"></div>
  <div id="dk-date" class="date" style="font-family:'Courier Prime', monospace; font-size:5.5cqh; color:#9c968a"></div>
</section>

<section class="face center" data-face="Lav" style="background:radial-gradient(90% 120% at 50% 60%, #1c0703, #050101 70%)">
  <div id="lava" style="position:absolute; inset:0"></div>
  <div class="t-hm" style="position:relative; font-family:Outfit, sans-serif; font-weight:200; font-size:min(50cqh, 22cqw); line-height:1; color:#fff1e4"></div>
  <div class="date" style="position:absolute; left:50%; bottom:6cqh; translate:-50% 0; gap:.35em; font-family:Outfit, sans-serif; font-weight:500; font-size:5cqh"><span class="dn" style="color:#fff1e4"></span><span class="dw" style="color:#ffb07a"></span></div>
</section>

</div>
</div>

<div id="dim"></div>

<div id="dots" hidden></div>

<div id="bat-hit" aria-label="Pil göstergesi">
  <div id="bat" hidden>
    <svg viewBox="0 0 36 36"><circle id="bat-track" cx="18" cy="18" r="15.9155" fill="none" stroke-width="3.4"></circle><circle id="bat-ring" cx="18" cy="18" r="15.9155" fill="none" stroke-width="3.4" stroke-linecap="round"></circle></svg>
    <div id="bat-num" class="bat-c"></div>
    <div id="bat-bolt" class="bat-c" hidden><svg viewBox="0 0 12 18"><polygon points="7,0 0,10 5,10 4,18 12,7 7,7"></polygon></svg></div>
  </div>
</div>

<div id="install" hidden>
  <img src="icon-192.png" alt="">
  <div style="flex:1; min-width:0">
    <div style="font-weight:600; font-size:15px; line-height:1.2">Ana ekrana ekle</div>
    <div style="font-size:13px; line-height:1.35; color:#b4b4b8; margin-top:3px">Safari'de Paylaş'a dokun, sonra “Ana Ekrana Ekle”yi seç. Tam ekran açılır.</div>
  </div>
  <button type="button" class="btn" data-act="install-ok">Anladım</button>
</div>

<div id="sheet-bg" hidden>
  <div id="sheet" role="dialog" aria-label="Ayarlar">
    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px">
      <div style="font-weight:600; font-size:17px">Ayarlar</div>
      <div style="font-size:12px; color:#8e8e93">Yüz değiştir: sağa/sola kaydır<span id="hint-bat"> · Pil: sağ üst köşe</span></div>
    </div>
    <div class="grid">
      <div class="row"><span>Saat biçimi</span>
        <div class="seg"><button type="button" data-set="h24" data-val="true">24 saat</button><button type="button" data-set="h24" data-val="false">12 saat</button></div>
      </div>
      <div class="row"><span>Gece modu</span><button type="button" class="sw" role="switch" data-toggle="night" aria-label="Gece modu"></button></div>
      <div class="row"><span>Tarih</span><button type="button" class="sw" role="switch" data-toggle="date" aria-label="Tarih"></button></div>
      <div class="row"><span>Saniye ibresi</span><button type="button" class="sw" role="switch" data-toggle="sec" aria-label="Saniye ibresi"></button></div>
      <div class="row"><span>Loşluk</span>
        <div style="display:flex; align-items:center; gap:10px"><input id="dim-range" type="range" min="0" max="70" step="5" aria-label="Loşluk" style="width:130px"><span id="dim-label" style="font-size:13px; color:#8e8e93; width:34px; text-align:right"></span></div>
      </div>
      <div class="row"><span>Gün dili</span>
        <div class="seg"><button type="button" data-set="lang" data-val="tr">Türkçe</button><button type="button" data-set="lang" data-val="en">English</button></div>
      </div>
      <div class="row">
        <div><div>Ekran açık kalsın</div><div id="wake-text" style="font-size:12px; color:#8e8e93; margin-top:1px"></div></div>
        <button type="button" class="sw" role="switch" data-toggle="awake" aria-label="Ekran açık kalsın"></button>
      </div>
      <div class="row"><span>Odak süresi</span>
        <div class="step"><button type="button" data-step="-5" aria-label="Odak süresini azalt">−</button><span id="focus-min"></span><button type="button" data-step="5" aria-label="Odak süresini artır">+</button></div>
      </div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:12px">
      <div id="bat-source" style="font-size:12px; color:#636366"></div>
      <button type="button" class="btn" data-act="close" style="padding:9px 18px">Kapat</button>
    </div>
  </div>
</div>

</div>
</div>
<script src="app.js"></script>
</body>
</html>
